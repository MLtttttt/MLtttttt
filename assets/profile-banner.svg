<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MLtttttt technical profile banner</title>
  <desc id="desc">A cyber technical GitHub profile banner about STM32, ESP32, Linux and QLC flash research.</desc>
  <defs>
